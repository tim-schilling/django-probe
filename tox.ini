[tox]
requires =
    tox>=4.22
    tox-uv>=1.20
env_list =
    py314-django{61, 60}
    py313-django{main, 61, 60, 52}
    py312-django{61, 60, 52, 50}
    py311-django{52, 50}
    webapp

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
# webapp-marked tests (src/webapp) run once in the webapp env below instead of
# on every Django version, since django-probe (the library) is what needs to
# support them all; the webapp just needs to run on one at a time.
commands =
    python -m pytest -m "not webapp" {posargs}
dependency_groups =
    webapp
    test
    django50: django50
    django52: django52
    django60: django60
    django61: django61
    djangomain: djangomain

[testenv:webapp]
base_python = python3.13
commands =
    python -m pytest -m webapp {posargs}
dependency_groups =
    webapp
    test
