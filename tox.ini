[tox]
requires =
    tox>=4.22
    tox-uv>=1.20
env_list =
    py314-django{61, 60}
    py313-django{main, 61, 60, 52}
    py312-django{61, 60, 52, 42}
    py311-django{52, 42}
    py310-django42
    py39-django42
    webapp

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
# tests.settings keeps the webapp's app stack out of this env, so the matrix can
# reach Python versions the webapp doesn't support.
commands =
    python -m pytest tests --ds=tests.settings {posargs}
dependency_groups =
    test
    django42: django42
    django50: django50
    django52: django52
    django60: django60
    django61: django61
    djangomain: djangomain

[testenv:webapp]
base_python = python3.13
commands =
    python -m pytest -m webapp {posargs}
dependency_groups =
    webapp
    test
