[tox]
requires =
    tox>=4.22
    tox-uv>=1.20
env_list =
    py314-django{61, 60}
    py313-django{main, 61, 60, 52}
    py312-django{61, 60, 52, 42}
    py311-django{52, 42}
    py310-django42
    py39-django42
    webapp
    e2e

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
# tests.settings keeps the webapp's app stack out of this env, so the matrix can
# reach Python versions the webapp doesn't support.
commands =
    python -m pytest tests --ds=tests.settings {posargs}
dependency_groups =
    test
    django42: django42
    django50: django50
    django52: django52
    django60: django60
    django61: django61
    djangomain: djangomain

[testenv:webapp]
base_python = python3.13
commands =
    python -m pytest -m webapp {posargs}
dependency_groups =
    webapp
    test

[testenv:e2e]
base_python = python3.13
package = skip
set_env =
    DJANGO_ALLOW_ASYNC_UNSAFE = true
    PLAYWRIGHT_BROWSERS_PATH = {toxworkdir}/playwright
commands_pre =
    python -m playwright install --with-deps chromium
commands =
    python -m pytest -o addopts=--strict-markers tests/e2e --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results {posargs}
dependency_groups =
    e2e
    webapp
    test
