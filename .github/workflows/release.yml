name: Publish Python 🐍 distribution 📦 to PyPI

on: push

permissions: {}

env:
  PYPI_URL: https://pypi.org/p/django-probe

jobs:

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: false
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: ${{ env.PYPI_URL }}
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: python-package-distributions
        path: dist/
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: false
    - name: Publish distribution 📦 to PyPI
      run: uv publish --trusted-publishing always

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: python-package-distributions
        path: dist/
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: docs/changelog.md
        sparse-checkout-cone-mode: false
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Extract changelog entry
      id: changelog
      run: |
        notes="$(awk -v ver="## ${GITHUB_REF_NAME}" '
          $0 == ver { found=1; next }
          found && /^## / { exit }
          found { print }
        ' docs/changelog.md | sed '/^[[:space:]]*$/d')"
        if [ -z "$notes" ]; then
          echo "No docs/changelog.md entry found for ${GITHUB_REF_NAME}" >&2
          exit 1
        fi
        {
          echo "notes<<EOF"
          echo "$notes"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        NOTES: ${{ steps.changelog.outputs.notes }}
      run: >-
        gh release create
        "${GITHUB_REF_NAME}"
        --repo '${{ github.repository }}'
        --draft
        --generate-notes
        --notes "$NOTES"
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        "${GITHUB_REF_NAME}" dist/**
        --repo '${{ github.repository }}'
