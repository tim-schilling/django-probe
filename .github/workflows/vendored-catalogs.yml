name: Vendored Django catalogs

on:
  schedule:
  - cron: '0 12 8 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  drift:
    name: Check for drift
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        enable-cache: false

    - name: Regenerate the catalogs
      run: uvx --from rust-just just vendor-django-vocabularies

    - name: Fail when the committed catalogs are out of date
      run: |
        git add --intent-to-add .
        git diff --stat
        git diff -- src/django_probe/_vendor/django_settings
        if ! git diff --quiet; then
          echo "::error::Run 'just vendor-django-vocabularies' and commit the result."
          exit 1
        fi
