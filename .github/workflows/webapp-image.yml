name: Build and publish webapp image

# Scoped to src/webapp and the Docker build files so that commits touching only
# src/django_probe (the PyPI package) never trigger a webapp rebuild/redeploy. This
# workflow never runs on tags: tags are reserved for versioning the PyPI package, kept
# entirely separate from this continuous-deploy flow.
on:
  push:
    branches: [main]
    paths:
      - src/webapp/**
      - Dockerfile
      - docker/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/webapp-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        if: ${{ vars.COOLIFY_WEBHOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            "${{ vars.COOLIFY_WEBHOOK_URL }}"
