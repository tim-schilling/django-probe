name: Django Probe Submit (uv)

on:
  workflow_call:
    inputs:
      path:
        description: Path to the Django project to scan, relative to the repository root.
        type: string
        default: '.'
      environment:
        description: >-
          GitHub environment to gate the submit job behind. Configure required
          reviewers on this environment under the calling repository's
          Settings → Environments. Leave unset to submit without an approval
          gate.
        type: string
        default: ''
      dependency-groups:
        description: >-
          Space-separated uv dependency groups to install before scanning,
          for projects whose production dependencies (e.g. Django) live
          outside uv's default group. Each is passed as its own
          `uv sync --group <value>`. Leave unset to rely on `uv run`'s own
          default sync.
        type: string
        default: ''
      python-version:
        description: >-
          Python version to set up, passed to astral-sh/setup-uv. Leave unset
          to let uv resolve its own default.
        type: string
        default: ''
    secrets:
      DJANGO_PROBE_TOKEN:
        required: false

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        if: inputs.dependency-groups != ''
        env:
          DEPENDENCY_GROUPS: ${{ inputs.dependency-groups }}
        run: |
          args=()
          for group in $DEPENDENCY_GROUPS; do
            args+=(--group "$group")
          done
          uv sync "${args[@]}"

      - name: Print the payload that submit would send
        env:
          PROBE_PATH: ${{ inputs.path }}
        run: uv run django-probe scan "$PROBE_PATH"

  submit:
    needs: scan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        if: inputs.dependency-groups != ''
        env:
          DEPENDENCY_GROUPS: ${{ inputs.dependency-groups }}
        run: |
          args=()
          for group in $DEPENDENCY_GROUPS; do
            args+=(--group "$group")
          done
          uv sync "${args[@]}"

      - name: Submit the payload
        env:
          DJANGO_PROBE_TOKEN: ${{ secrets.DJANGO_PROBE_TOKEN }}
          PROBE_PATH: ${{ inputs.path }}
        run: uv run django-probe submit "$PROBE_PATH"
