name: Test Python 🐍 distribution 📦 to TestPyPI

on:
  workflow_dispatch:
    inputs:
      iteration:
        description: 'A unique iteration for the run. The built version will be suffixed with .devyyyymmdd<iteration>'
        type: string
        required: true
        default: "0"
  schedule:
    # Run the second day of every month.
    - cron: "12 3 2 * *"

permissions: {}

env:
  PYPI_TEST_URL: https://test.pypi.org/p/django-probe

jobs:
  create-dev-version:
    # Generate the dev version suffix based on the current date, e.g.
    # <version>.dev<yyyymmdd><iteration>
    name: Create dev version string
    # Prevent this workflow from running on forks
    if: github.repository == 'tim-schilling/django-probe'
    runs-on: ubuntu-latest
    outputs:
      dev_version: ${{ steps.output-dev-version.outputs.dev_version }}
    steps:
    - name: Set date suffix
      id: set-date
      run: echo "suffix=dev$(date +%Y%m%d)" >> $GITHUB_ENV
    - name: Determine Iteration Value
      id: set-iteration
      # If the action is running on a schedule, default iteration to 0
      env:
        ITERATION_INPUT: ${{ github.event.inputs.iteration }}
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "iteration=$ITERATION_INPUT" >> $GITHUB_ENV
        else
          echo "iteration=0" >> $GITHUB_ENV
        fi
    - name: Output dev version
      id: output-dev-version
      # suffix/iteration are already shell env vars, set via $GITHUB_ENV above
      run: echo "dev_version=.$suffix$iteration" >> "$GITHUB_OUTPUT"

  build:
    name: Build distribution 📦
    needs:
    - create-dev-version
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: false
    - name: Build a binary wheel and a source tarball
      env:
        DJANGO_PROBE_VERSION_DEV: ${{ needs.create-dev-version.outputs.dev_version }}
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: ${{ env.PYPI_TEST_URL }}

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: python-package-distributions
        path: dist/
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: false
    - name: Publish distribution 📦 to TestPyPI
      run: >-
        uv publish
        --publish-url https://test.pypi.org/legacy/
        --check-url https://test.pypi.org/simple/
        --trusted-publishing always
