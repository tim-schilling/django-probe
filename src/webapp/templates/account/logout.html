{% extends "base.html" %}
{% block title %}Sign out | Django Probe{% endblock %}

{% block content %}
<header class="page-header">
  <p class="eyebrow">Account</p>
  <h1>Sign out</h1>
</header>
<div class="panel panel--subtle auth-panel">
<p>Are you sure you want to sign out?</p>
<form method="post" action="{% url 'account_logout' %}">
  {% csrf_token %}
  {{ redirect_field }}
  <button type="submit">Sign out</button>
</form>
</div>
{% endblock %}
